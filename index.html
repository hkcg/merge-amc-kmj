<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>Union Merge Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #dceffa;
      --surface: #ffffff;
      --border: #b8dcf2;
      --border-hover: #487d9d;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --amc-color: #3b82f6;
      --amc-bg: #eff6ff;
      --kmj-color: #f97316;
      --kmj-bg: #fff7ed;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --info: #0ea5e9;
      --info-bg: #f0f9ff;
      --radius-sm: 6px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .top-bar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.375rem 0;
    }

    .top-bar-inner,
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .top-bar-inner {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 2px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .lang-switch button {
      background: transparent;
      border: none;
      padding: 0.1875rem 0.625rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.25;
      color: var(--text-light);
      font-family: inherit;
      transition: color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .lang-switch button:hover:not(.active) { color: var(--text-muted); }

    .lang-switch button.active {
      background: var(--surface);
      color: var(--info);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(14, 165, 233, 0.12);
    }

    .lang-switch-sep {
      width: 1px;
      height: 0.75rem;
      background: var(--border);
      flex-shrink: 0;
    }

    .container {
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    .header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .header-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .dot { color: var(--border-hover); }

    .team-badges {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .team-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.75rem 0.25rem 0.25rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .team-badge-amc { color: var(--amc-color); }
    .team-badge-kmj { color: var(--kmj-color); }

    .team-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 1px var(--border);
      vertical-align: middle;
    }

    .login-wrap {
      max-width: 440px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      position: relative;
      border-top: 4px solid var(--info);
    }

    .card.locked {
      pointer-events: none;
    }

    .card-header {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-header svg {
      width: 18px;
      height: 18px;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .field {
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--border-hover);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
    }

    input:disabled {
      background: var(--bg);
      opacity: 0.75;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.625rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--amc-color), var(--info));
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.05);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 0.875rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .message.error {
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid #fecaca;
    }

    .message.warn {
      color: #92400e;
      background: var(--warning-bg);
      border: 1px solid #fde68a;
    }

    .attempts {
      margin-top: 0.75rem;
      color: var(--text-light);
      font-size: 0.8rem;
      text-align: center;
    }

    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(2px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1.5rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .card.locked .overlay {
      display: flex;
    }

    .overlay strong {
      color: var(--text-main);
      font-size: 1rem;
    }

    .overlay span {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .overlay .countdown {
      font-size: 2rem;
      font-weight: 700;
      color: var(--warning);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-top: 0.25rem;
    }

    .lang-zh { display: none; }
    body.zh .lang-en { display: none !important; }
    body.zh .lang-zh { display: inline; }

    @media (max-width: 768px) {
      .header-title { font-size: 1.5rem; }
      .header { align-items: flex-start; }
    }
  </style>
</head>

    <div class="login-wrap">
      <form class="card" id="login">
        <div class="card-header">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span class="lang-en">Sign in</span>
          <span class="lang-zh">登入</span>
        </div>

        <p class="card-desc">
          <span class="lang-en">Enter alliance credentials to view the merge report.</span>
          <span class="lang-zh">輸入聯盟憑證以查看合併分析報告。</span>
        </p>

        <div class="field">
          <label for="user">
            <span class="lang-en">Username</span>
            <span class="lang-zh">使用者名稱</span>
          </label>
          <input id="user" name="user" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="pass">
            <span class="lang-en">Password</span>
            <span class="lang-zh">密碼</span>
          </label>
          <input id="pass" name="pass" type="password" autocomplete="current-password" required />
        </div>

        <button class="btn btn-primary" type="submit" id="submit">
          <span class="lang-en">Sign in</span>
          <span class="lang-zh">登入</span>
        </button>

        <div class="message error" id="error"></div>
        <div class="message warn" id="warn"></div>
        <div class="attempts" id="attempts"></div>

        <div class="overlay" id="lock-overlay" aria-hidden="true">
          <strong>
            <span class="lang-en">Too many failed attempts</span>
            <span class="lang-zh">失敗次數過多</span>
          </strong>
          <span>
            <span class="lang-en">Please wait before trying again</span>
            <span class="lang-zh">請稍候再試</span>
          </span>
          <div class="countdown" id="countdown">30</div>
        </div>
      </form>
    </div>
  </div>

  <script>
    function redirectLangQuery() {
      const fromUrl = new URLSearchParams(location.search).get("lang") === "zh";
      const fromBody = document.body.classList.contains("zh");
      return fromUrl || fromBody ? "?lang=zh" : "";
    }

    function setLang(lang) {
      const isZh = lang === "zh";
      document.body.classList.toggle("zh", isZh);
      document.documentElement.lang = isZh ? "zh-TW" : "en";
      document.getElementById("btn-en").classList.toggle("active", !isZh);
      document.getElementById("btn-zh").classList.toggle("active", isZh);
      if (isZh) sessionStorage.setItem("mergeLang", "zh");
      else sessionStorage.removeItem("mergeLang");
      const url = new URL(location.href);
      if (isZh) url.searchParams.set("lang", "zh");
      else url.searchParams.delete("lang");
      history.replaceState(null, "", url);
    }

    function initLangFromUrl() {
      const isZh = new URLSearchParams(location.search).get("lang") === "zh";
      setLang(isZh ? "zh" : "en");
    }

    const MAX_ATTEMPTS = 3;
    const LOCK_MS = 30_000;
    const STORAGE_ATTEMPTS = "mergeLoginAttempts";
    const STORAGE_LOCK_UNTIL = "mergeLoginLockUntil";
    const STORAGE_AUTH = "mergeReportAuth";
    const AUTH_TTL_MS = 60 * 60 * 1000;

    const form = document.getElementById("login");
    const submit = document.getElementById("submit");
    const userInput = document.getElementById("user");
    const passInput = document.getElementById("pass");
    const errorEl = document.getElementById("error");
    const warnEl = document.getElementById("warn");
    const attemptsEl = document.getElementById("attempts");
    const countdownEl = document.getElementById("countdown");
    const lockOverlay = document.getElementById("lock-overlay");

    let lockTimer = null;

    function t(en, zh) {
      return document.body.classList.contains("zh") ? zh : en;
    }

    function submitLabel(loading) {
      submit.innerHTML = loading
        ? t("Signing in…", "登入中…")
        : `<span class="lang-en">Sign in</span><span class="lang-zh">登入</span>`;
    }

    function showMessage(el, text) {
      errorEl.style.display = "none";
      warnEl.style.display = "none";
      if (!text) return;
      el.textContent = text;
      el.style.display = "block";
    }

    function getAttempts() {
      return Number(sessionStorage.getItem(STORAGE_ATTEMPTS) || "0");
    }

    function setAttempts(value) {
      sessionStorage.setItem(STORAGE_ATTEMPTS, String(value));
      updateAttemptsLabel();
    }

    function getLockUntil() {
      return Number(sessionStorage.getItem(STORAGE_LOCK_UNTIL) || "0");
    }

    function setLockUntil(timestamp) {
      if (timestamp > 0) {
        sessionStorage.setItem(STORAGE_LOCK_UNTIL, String(timestamp));
      } else {
        sessionStorage.removeItem(STORAGE_LOCK_UNTIL);
      }
    }

    function updateAttemptsLabel() {
      const failed = getAttempts();
      const remaining = MAX_ATTEMPTS - failed;
      if (failed === 0 || remaining <= 0 || isLocked()) {
        attemptsEl.textContent = "";
        return;
      }
      attemptsEl.textContent =
        remaining === 1
          ? t("1 attempt remaining", "剩餘 1 次嘗試")
          : t(`${remaining} attempts remaining`, `剩餘 ${remaining} 次嘗試`);
    }

    function isLocked() {
      return Date.now() < getLockUntil();
    }

    function setFormDisabled(disabled) {
      userInput.disabled = disabled;
      passInput.disabled = disabled;
      submit.disabled = disabled;
    }

    function clearLockTimer() {
      if (lockTimer) {
        clearInterval(lockTimer);
        lockTimer = null;
      }
    }

    function unlockForm() {
      clearLockTimer();
      setLockUntil(0);
      setAttempts(0);
      form.classList.remove("locked");
      lockOverlay.setAttribute("aria-hidden", "true");
      setFormDisabled(false);
      showMessage(errorEl, "");
      showMessage(warnEl, "");
      submitLabel(false);
      updateAttemptsLabel();
      userInput.focus();
    }

    function startLockCountdown() {
      setAttempts(0);
      setLockUntil(Date.now() + LOCK_MS);
      form.classList.add("locked");
      lockOverlay.setAttribute("aria-hidden", "false");
      setFormDisabled(true);
      showMessage(errorEl, "");
      showMessage(warnEl, "");

      const tick = () => {
        const remainingMs = getLockUntil() - Date.now();
        if (remainingMs <= 0) {
          unlockForm();
          showMessage(warnEl, t("You may try again.", "您可以再次嘗試。"));
          return;
        }
        countdownEl.textContent = String(Math.ceil(remainingMs / 1000));
      };

      tick();
      clearLockTimer();
      lockTimer = setInterval(tick, 250);
    }

    function applyLockStateOnLoad() {
      if (!isLocked()) {
        updateAttemptsLabel();
        return;
      }
      form.classList.add("locked");
      lockOverlay.setAttribute("aria-hidden", "false");
      setFormDisabled(true);

      const tick = () => {
        const remainingMs = getLockUntil() - Date.now();
        if (remainingMs <= 0) {
          unlockForm();
          return;
        }
        countdownEl.textContent = String(Math.ceil(remainingMs / 1000));
      };

      tick();
      clearLockTimer();
      lockTimer = setInterval(tick, 250);
    }

    async function credentialHash(username, password) {
      const value = `${username}:${password}`;
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    async function reportExists(hash) {
      const url = `${hash}.html`;
      try {
        const head = await fetch(url, { method: "HEAD", cache: "no-store" });
        if (head.ok) return true;
        if (head.status === 405 || head.status === 501) {
          const get = await fetch(url, { method: "GET", cache: "no-store" });
          return get.ok;
        }
        return false;
      } catch {
        return false;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (isLocked()) {
        startLockCountdown();
        return;
      }

      showMessage(errorEl, "");
      showMessage(warnEl, "");
      submit.disabled = true;
      submitLabel(true);

      try {
        const username = userInput.value.trim();
        const password = passInput.value;

        if (!username || !password) {
          showMessage(
            errorEl,
            t("Enter both username and password.", "請輸入使用者名稱與密碼。"),
          );
          return;
        }

        const hash = await credentialHash(username, password);
        const found = await reportExists(hash);

        if (found) {
          sessionStorage.removeItem(STORAGE_ATTEMPTS);
          sessionStorage.removeItem(STORAGE_LOCK_UNTIL);
          sessionStorage.setItem(
            STORAGE_AUTH,
            JSON.stringify({
              hash,
              expiresAt: Date.now() + AUTH_TTL_MS,
            }),
          );
          const langQuery = redirectLangQuery();
          if (langQuery) sessionStorage.setItem("mergeLang", "zh");
          else sessionStorage.removeItem("mergeLang");
          window.location.href = `${hash}.html${langQuery}`;
          return;
        }

        const attempts = getAttempts() + 1;
        setAttempts(attempts);

        if (attempts >= MAX_ATTEMPTS) {
          startLockCountdown();
          return;
        }

        showMessage(
          errorEl,
          t("Invalid username or password.", "使用者名稱或密碼錯誤。"),
        );
        passInput.value = "";
        passInput.focus();
      } catch {
        showMessage(
          errorEl,
          t("Sign-in failed. Please try again.", "登入失敗，請再試一次。"),
        );
      } finally {
        if (!isLocked()) {
          submit.disabled = false;
          submitLabel(false);
        }
        updateAttemptsLabel();
      }
    });

    initLangFromUrl();
    applyLockStateOnLoad();
    if (!isLocked()) {
      userInput.focus();
    }
  </script>
</body>
</html>
